spring.application.name=tallerexpress-api

# La cadena de conexión NUNCA va en el código: se lee de la variable de entorno MONGODB_URI
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/tallerexpress}

# Render asigna el puerto en la variable PORT
server.port=${PORT:8080}

# Clave de los usuarios de prueba que se crean con la base vacía
taller.clave-inicial=${TALLER_CLAVE_INICIAL:Taller2026*}

spring.jackson.default-property-inclusion=non_null
spring.jackson.time-zone=America/Bogota
spring.jackson.serialization.write-dates-as-timestamps=false

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=alpha
